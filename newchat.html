<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>开启新项目</title>
<!-- 托盘入口跳板：macOS 打开 file:// URL 会丢弃 ?query，需在页面内跳转
     （location.replace 不留历史）；chat 分支维持原跳板行为 -->
<style>
  :root { --bg:#0d1117; --panel:#161b22; --border:#2d333b; --text:#e6edf3; --dim:#8b949e; --accent:#4f8cf7;
    --danger:#f85149; --ok:#3fb950; --warn:#d29922; --hover:#262d36; --sel:#22304a; --scroll-thumb:#3d444d;
    --dur-fast:.12s; --dur-base:.18s; --ease:cubic-bezier(.2,0,0,1);
    --code-bg:#21262d; --accent-hi:#7fb0ff; --scrim:rgba(0,0,0,.5);
    --shadow-pop:0 4px 16px rgba(0,0,0,.5); --shadow-menu:0 8px 30px rgba(0,0,0,.5); --shadow-modal:0 8px 40px rgba(0,0,0,.6); }
  * { box-sizing: border-box; margin: 0; }
  html { -webkit-font-smoothing: antialiased; }
  ::selection { background: rgba(79,140,247,.35); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  :focus:not(:focus-visible) { outline: none; }
  button, input { line-height: 1.5; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
  body { background: var(--bg); color: var(--text); height: 100vh;
    display: flex; align-items: center; justify-content: center;
    font: 15px/1.7 -apple-system, "PingFang SC", sans-serif; }
  .wrap { width: min(560px, 92vw); }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .sub { color: var(--dim); font-size: 13px; margin-bottom: 24px; }
  .opt {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 20px 24px; margin-bottom: 12px; cursor: pointer;
  }
  .opt:hover { border-color: var(--accent); }
  .opt:active { transform: scale(.99); }
  .opt svg { width: 18px; height: 18px; vertical-align: -4px; margin-right: 8px; }
  .opt b { font-size: 15px; display: block; }
  .opt small { color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>开启新项目</h1>
  <div class="sub">读文献与写作是同一个项目的两种开场，之后可随时互跳</div>
  <div class="opt" onclick="location.replace('chat.html?new=1')">
    <b><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>新对话</b><small>读文献 · 提问 · 日常</small>
  </div>
  <div class="opt" onclick="newWrite()">
    <b><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>新写作</b><small>论文 · 方案 · 分章节写作与版本管理</small>
  </div>
</div>
<script>
const ARCH = "http://127.0.0.1:8081";
async function newWrite(){
  const name = prompt("写作项目名称：");
  if (!name?.trim()) return;
  const id = "c" + Date.now();
  const title = "✍️ " + name.trim();
  const safe = title.replace(/[\\/:*?"<>|\s]/g, "_").slice(0, 20);
  try {
    await fetch(`${ARCH}/archive/${encodeURIComponent(`${id}-${safe}.json`)}`, {
      method: "PUT", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({id, title, ts: Date.now(), ctxUsed: 0, messages: []}),
    });
    location.replace("editor.html?conv=" + id);
  } catch { alert("创建失败：无法连接存档服务 127.0.0.1:8081"); }
}
</script>
</body>
</html>
